schema = 2

[package]
name = "sql"
version = "0.1.0"
cppstd = "20"

[build]
generator = "Ninja"
default_profile = "debug"

[[bin]]
name = "sql"
path = "src/main.cpp"
links = ["fmt", "sqlite3", "math", "mathst"]

[[test]]
name = "sql_tests"
path = "tests/main.cpp"
links = ["math", "mathst"]

[dependencies.sqlite3]
source = "vcpkg"
port = "sqlite3"
cmake_target = "unofficial::sqlite3::sqlite3"
cmake_package = "unofficial-sqlite3"

[dependencies.fmt]
source = "conan"
ref = "fmt/12.2.0"
cmake_target = "fmt::fmt-header-only"
cmake_package = "fmt"

[dependencies.fmt.conan_options]
header_only = "True"

[workspace]
members = ["libs/math", "libs/mathst"]
