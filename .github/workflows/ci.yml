name: forge-ci

# Real-tool gate: every phase must pass on BOTH macOS and Ubuntu.
# Tool minimums are pinned in tools.versions at the repository root.
on:
  push:
  pull_request:

jobs:
  foundations:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash cmake ninja jq shellcheck bats-core doxygen

      - name: Install tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bash cmake ninja-build jq shellcheck bats git python3 python3-venv doxygen

      - name: Install Conan in a virtual environment
        run: |
          python3 -m venv "$RUNNER_TEMP/forge-conan-venv"
          "$RUNNER_TEMP/forge-conan-venv/bin/python" -m pip install conan==2.33.0
          echo "$RUNNER_TEMP/forge-conan-venv/bin" >> "$GITHUB_PATH"

      - name: Prepare the Conan integration fixture
        run: |
          conan profile detect --force
          conan install --requires=fmt/12.1.0 -o 'fmt/*:header_only=True' \
            -s build_type=Debug --build=missing --output-folder="$RUNNER_TEMP/forge-conan-fmt"

      - name: Show tool versions
        run: |
          bash --version | head -1
          cmake --version | head -1
          conan --version
          jq --version

      - name: ShellCheck (mandatory)
        run: shellcheck -x -S warning bin/forge install.sh uninstall.sh lib/*.sh lib/commands/*.sh tests/run.sh tests/fakebin/*

      - name: Doctor
        run: bash bin/forge --no-color doctor

      - name: Bats unit and integration tests
        run: bash tests/run.sh --print-output-on-failure

