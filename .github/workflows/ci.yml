name: forge-ci

# Real-tool gate: every phase must pass on BOTH macOS and Ubuntu.
# Tool minimums are pinned in tools.versions at the repository root.
on:
  push:
  pull_request:

jobs:
  foundations:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash cmake ninja jq shellcheck bats-core doxygen
          python3 -m pip install --upgrade 'conan>=2'

      - name: Install tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bash cmake ninja-build jq shellcheck bats git python3 python3-pip doxygen
          python3 -m pip install --upgrade 'conan>=2'

      - name: Show tool versions
        run: |
          bash --version | head -1
          cmake --version | head -1
          conan --version
          jq --version

      - name: ShellCheck (mandatory)
        run: shellcheck -x -S warning bin/forge install.sh uninstall.sh lib/*.sh lib/commands/*.sh tests/run.sh tests/fakebin/*

      - name: Doctor
        run: bash bin/forge --no-color doctor

      - name: Bats unit tests
        run: bash tests/run.sh

  # Real configure/build/test integration jobs are added with Phase 1/2.
