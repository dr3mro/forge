schema = 1

[package]
name = "hello"
version = "0.1.0"
cppstd = "20"

[build]
generator = "Ninja"
default_profile = "debug"

[[bin]]
name = "hello"
path = "src/main.cpp"
links = ["fmt", "logger"]

[[test]]
name = "hello_tests"
path = "tests/main.cpp"
links = ["hello_lib", "catch2"]

[dependencies.fmt]
source = "conan"
ref = "fmt/10.2.1"
cmake_target = "fmt::fmt"

[dependencies.catch2]
source = "git"
url = "https://github.com/catchorg/Catch2.git"
rev = "1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d"
cmake_target = "Catch2::Catch2WithMain"

[dependencies.logger]
source = "path"
path = "libs/logger"
cmake_target = "logger"
